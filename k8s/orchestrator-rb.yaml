# k8s/orchestrator-rb.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-rb
  namespace: ai-assistant
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: ai-assistant
roleRef:
  kind: Role
  name: orchestrator-role
  apiGroup: rbac.authorization.k8s.io