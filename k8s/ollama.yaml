# ==========================
# AI Engine Deployment
# ==========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
        - name: ai-engine
          image: ai-devops-copilot_ai-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"

---

# ==========================
# AI Engine Service
# ==========================
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: ai-assistant
spec:
  selector:
    app: ai-engine
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---

# ==========================
# Ollama Deployment
# ==========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434

---

# ==========================
# Ollama Service
# ==========================
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-assistant
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP