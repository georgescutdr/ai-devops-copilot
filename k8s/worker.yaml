apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Init container waits for RabbitMQ before starting main container
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ..."
              until wget -q --spider http://rabbitmq.ai-assistant.svc.cluster.local:15672; do
                echo "RabbitMQ not ready, sleeping 2s..."
                sleep 2
              done
              echo "RabbitMQ is ready!"

      containers:
        - name: worker
          image: ai-devops-copilot_worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker-config
          # Readiness probe for RabbitMQ
          readinessProbe:
            exec:
              command: ["sh", "-c", "wget -q --spider http://rabbitmq.ai-assistant.svc.cluster.local:15672"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: ai-assistant
data:
  RABBITMQ_URL: "amqp://rabbitmq.ai-assistant.svc.cluster.local:5672"
  QUEUE_NAME: "tasks.queue"